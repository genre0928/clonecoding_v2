<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="device__info">
        <div class="device__info_group">
          <div class="device__info_time">
            <div>1:28</div>
          </div>
        </div>
        <div class="device__info_group">
          <div class="device__info_signal">
            <div>S</div>
          </div>
          <div class="device__info_wifi">
            <div>W</div>
          </div>
          <div class="device__info_battery">
            <div>B</div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="main__index">
        <div class="main__index_item">
          <span>브랜드</span>
          <span>new</span>
        </div>
        <div class="main__index_item">랭킹</div>
        <div class="main__index_item">스토어</div>
        <div class="main__index_item">세일</div>
        <div class="main__index_item">스타일</div>
      </div>
      <div class="main__ad">
        <div class="main__ad_img">
          <img
            src="https://cdn.gjdream.com/news/photo/202009/602564_202355_2945.jpg"
            alt=""
          />
        </div>
        <div class="main__ad_count">
          <span>4/4</span>
        </div>
      </div>
      <div class="main__brand">
        <div class="main__brand_index">
          <div>인기 브랜드</div>
          <div>전체보기</div>
        </div>
        <!-- 브랜드 노출될 때 하트 모양과 브랜드 이름, 로고를 하나의 모듈로 만들어서 위치 일괄 지정토록 함 -->
        <div class="main__brand_items">
          <div class="main__brand_item">
            <button class="main__brand_item_icon">♡</button>
            <div class="main__brand_item_logo">로고</div>
            <div class="main__brand_item_brandname">반스</div>
          </div>
          <div class="main__brand_item">
            <button class="main__brand_item_icon">♡</button>
            <div class="main__brand_item_logo">로고</div>
            <div class="main__brand_item_brandname">아디다스</div>
          </div>
          <div class="main__brand_item">
            <button class="main__brand_item_icon">♡</button>
            <div class="main__brand_item_logo">로고</div>
            <div class="main__brand_item_brandname">언코티드</div>
          </div>
        </div>
      </div>
      <div class="main__category">
        <div class="main__category_index">카테고리</div>
        <div class="main__category_items">
          <div class="main__category_item">
            <div class="main__category_item_icon">I</div>
            <div class="main__category_item_name">전체보기</div>
          </div>
          <div class="main__category_item">
            <div class="main__category_item_icon">I</div>
            <div class="main__category_item_name">상의</div>
          </div>
          <div class="main__category_item">
            <div class="main__category_item_icon">I</div>
            <div class="main__category_item_name">하의</div>
          </div>
          <div class="main__category_item">
            <div class="main__category_item_icon">I</div>
            <div class="main__category_item_name">아우터</div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="menu__boxes">
        <div class="menu__boxes_item">
          <div class="menu__boxes_item_icon">H</div>
          <div class="menu__boxes_item_name">홈</div>
        </div>
        <div class="menu__boxes_item">
          <div class="menu__boxes_item_icon">C</div>
          <div class="menu__boxes_item_name">코디</div>
        </div>
        <div class="menu__boxes_item">
          <div class="menu__boxes_item_icon">P</div>
          <div class="menu__boxes_item_name">핀</div>
        </div>
        <div class="menu__boxes_item">
          <div class="menu__boxes_item_icon">M</div>
          <div class="menu__boxes_item_name">MY 룩핀</div>
        </div>
      </div>
    </footer>
  </body>
</html>
